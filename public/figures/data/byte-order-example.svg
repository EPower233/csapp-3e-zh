<svg xmlns="http://www.w3.org/2000/svg" width="642" height="162" viewBox="0 0 642 162" role="img" aria-labelledby="title desc">
<title id="title">大端法与小端法</title><desc id="desc">0x01234567 在地址 0x100 到 0x103 上分别按 01、23、45、67 和 67、45、23、01 排列。</desc>
<style>
svg { --ink:#202737; --muted:#45546b; --line:#536680; --accent:#245a9b;
      --soft:#e3effb; --strong:#b6d4f5; --panel:#f3f6fa;
      --grid:#bec8d7; }
@media (prefers-color-scheme:dark) {
  svg { --ink:#e6edf7; --muted:#becbdd; --line:#94a9c6; --accent:#8abdfb;
        --soft:#243753; --strong:#3b5b86; --panel:#202933;
        --grid:#53647b; }
}
text { fill:var(--ink); font-family:system-ui,"Microsoft YaHei","PingFang SC",
       "Noto Sans CJK SC",sans-serif; dominant-baseline:middle; }
.mono { font-family:"Cascadia Mono",Consolas,"Microsoft YaHei",monospace; }
.muted { fill:var(--muted); }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--line)"/></marker></defs>
<text x="22" y="16" font-size="16" text-anchor="start" class="" font-weight="650">大端法</text>
<rect x="22" y="52" width="84" height="25" rx="0" fill="none" stroke="var(--line)" stroke-width="1.5"/>
<text x="64" y="64.5" font-size="16" text-anchor="middle" class="" font-weight="400">…</text>
<rect x="106" y="52" width="107" height="25" rx="0" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/>
<text x="159.5" y="64.5" font-size="16" text-anchor="middle" class="mono" font-weight="400">01</text>
<rect x="213" y="52" width="107" height="25" rx="0" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/>
<text x="266.5" y="64.5" font-size="16" text-anchor="middle" class="mono" font-weight="400">23</text>
<rect x="320" y="52" width="107" height="25" rx="0" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/>
<text x="373.5" y="64.5" font-size="16" text-anchor="middle" class="mono" font-weight="400">45</text>
<rect x="427" y="52" width="107" height="25" rx="0" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/>
<text x="480.5" y="64.5" font-size="16" text-anchor="middle" class="mono" font-weight="400">67</text>
<rect x="534" y="52" width="84" height="25" rx="0" fill="none" stroke="var(--line)" stroke-width="1.5"/>
<text x="576" y="64.5" font-size="16" text-anchor="middle" class="" font-weight="400">…</text>
<text x="159.5" y="40" font-size="14" text-anchor="middle" class="mono" font-weight="400">0x100</text>
<text x="266.5" y="40" font-size="14" text-anchor="middle" class="mono" font-weight="400">0x101</text>
<text x="373.5" y="40" font-size="14" text-anchor="middle" class="mono" font-weight="400">0x102</text>
<text x="480.5" y="40" font-size="14" text-anchor="middle" class="mono" font-weight="400">0x103</text>
<text x="22" y="91" font-size="16" text-anchor="start" class="" font-weight="650">小端法</text>
<rect x="22" y="127" width="84" height="25" rx="0" fill="none" stroke="var(--line)" stroke-width="1.5"/>
<text x="64" y="139.5" font-size="16" text-anchor="middle" class="" font-weight="400">…</text>
<rect x="106" y="127" width="107" height="25" rx="0" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/>
<text x="159.5" y="139.5" font-size="16" text-anchor="middle" class="mono" font-weight="400">67</text>
<rect x="213" y="127" width="107" height="25" rx="0" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/>
<text x="266.5" y="139.5" font-size="16" text-anchor="middle" class="mono" font-weight="400">45</text>
<rect x="320" y="127" width="107" height="25" rx="0" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/>
<text x="373.5" y="139.5" font-size="16" text-anchor="middle" class="mono" font-weight="400">23</text>
<rect x="427" y="127" width="107" height="25" rx="0" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/>
<text x="480.5" y="139.5" font-size="16" text-anchor="middle" class="mono" font-weight="400">01</text>
<rect x="534" y="127" width="84" height="25" rx="0" fill="none" stroke="var(--line)" stroke-width="1.5"/>
<text x="576" y="139.5" font-size="16" text-anchor="middle" class="" font-weight="400">…</text>
<text x="159.5" y="115" font-size="14" text-anchor="middle" class="mono" font-weight="400">0x100</text>
<text x="266.5" y="115" font-size="14" text-anchor="middle" class="mono" font-weight="400">0x101</text>
<text x="373.5" y="115" font-size="14" text-anchor="middle" class="mono" font-weight="400">0x102</text>
<text x="480.5" y="115" font-size="14" text-anchor="middle" class="mono" font-weight="400">0x103</text>
</svg>
