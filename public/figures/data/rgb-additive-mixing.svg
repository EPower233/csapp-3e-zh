<circle cx="427" cy="185" r="37" fill="#00f" style="mix-blend-mode:screen"/>
</g>
<path d="M516,166 Q545,141 573,166 Q545,191 516,166 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="541" cy="166" r="7" fill="var(--accent)" stroke="none" stroke-width="1.5"/>
<text x="427" y="302" font-size="14" text-anchor="middle" class="muted" font-weight="400">红光、绿光与蓝光叠加</text>
