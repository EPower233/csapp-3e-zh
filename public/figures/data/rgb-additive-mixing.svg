<text x="427" y="25" font-size="16" text-anchor="middle" class="" font-weight="650">玻璃屏幕</text>
<text x="543" y="126" font-size="16" text-anchor="middle" class="" font-weight="650">观察者</text>
<rect x="350" y="56" width="154" height="222" rx="9" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
<text x="35" y="78" font-size="16" text-anchor="middle" class="" font-weight="400">红</text>
<path d="M146,67 L400,108 L400,158 L146,89 Z" fill="#ff0000" opacity=".20"/>
<rect x="64" y="68" width="84" height="20" rx="9" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="145" cy="78" r="11" fill="#ff0000" stroke="var(--line)" stroke-width="1.5"/>
<text x="35" y="166" font-size="16" text-anchor="middle" class="" font-weight="400">绿</text>
<path d="M146,155 L453,108 L453,158 L146,177 Z" fill="#00ff00" opacity=".20"/>
<rect x="64" y="156" width="84" height="20" rx="9" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="145" cy="166" r="11" fill="#00ff00" stroke="var(--line)" stroke-width="1.5"/>
<text x="35" y="252" font-size="16" text-anchor="middle" class="" font-weight="400">蓝</text>
<path d="M146,241 L427,160 L427,210 L146,263 Z" fill="#0000ff" opacity=".20"/>
<rect x="64" y="242" width="84" height="20" rx="9" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="145" cy="252" r="11" fill="#0000ff" stroke="var(--line)" stroke-width="1.5"/>
<g style="isolation:isolate"><rect x="362" y="68" width="130" height="198" rx="5" fill="#000"/>
<circle cx="400" cy="133" r="37" fill="#f00" style="mix-blend-mode:screen"/>
