<svg xmlns="http://www.w3.org/2000/svg" width="694" height="146" viewBox="0 0 694 146" role="img" aria-labelledby="title desc">
<title id="title">组合逻辑分块延迟</title><desc id="desc">A 到 F 依次为 80、30、60、50、70、10 ps，末尾的流水线寄存器为 20 ps。</desc>
<style>
