<svg xmlns="http://www.w3.org/2000/svg" width="487" height="225" viewBox="0 0 487 225" role="img" aria-labelledby="title desc">
<title id="title">随机访问数据存储器端口</title><desc id="desc">地址、数据输入、读、写和时钟信号进入数据存储器，数据输出和 error 信号离开数据存储器。</desc>
<style>
svg { --ink:#202737; --muted:#45546b; --line:#536680; --accent:#245a9b;
      --soft:#e3effb; --strong:#b6d4f5; --panel:#f3f6fa;
      --grid:#bec8d7; }
@media (prefers-color-scheme:dark) {
  svg { --ink:#e6edf7; --muted:#becbdd; --line:#94a9c6; --accent:#8abdfb;
        --soft:#243753; --strong:#3b5b86; --panel:#202933;
        --grid:#53647b; }
}
text { fill:var(--ink); font-family:system-ui,"Microsoft YaHei","PingFang SC",
       "Noto Sans CJK SC",sans-serif; dominant-baseline:middle; }
.mono { font-family:"Cascadia Mono",Consolas,"Microsoft YaHei",monospace; }
.muted { fill:var(--muted); }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--line)"/></marker></defs>
<rect x="154" y="68" width="176" height="86" rx="4" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/>
<text x="242" y="111" font-size="19" text-anchor="middle" class="" font-weight="650">数据存储器</text>
<path d="M189,68 V48 H100" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="92" y="49" font-size="16" text-anchor="end" class="mono" font-weight="400">error</text>
<path d="M99,93 L154,93" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="78" y="93" font-size="16" text-anchor="end" class="" font-weight="400">读</text>
<path d="M99,132 L154,132" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="78" y="132" font-size="16" text-anchor="end" class="" font-weight="400">写</text>
<path d="M242,68 L242,40" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="242" y="24" font-size="16" text-anchor="middle" class="" font-weight="400">数据输出</text>
<path d="M400,132 L330,132" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="414" y="132" font-size="16" text-anchor="start" class="" font-weight="400">时钟</text>
<path d="M194,189 L194,154" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="194" y="205" font-size="16" text-anchor="middle" class="" font-weight="400">地址</text>
<path d="M288,189 L288,154" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="288" y="205" font-size="16" text-anchor="middle" class="" font-weight="400">数据输入</text>
</svg>
